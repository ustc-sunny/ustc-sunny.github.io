<ul class="publication-list">
  {% for paper in site.data.publications %}
  <li{% if paper.author_position > 2 %} data-additional-publication{% endif %}>
    <span class="publication-venue{% if paper.citation contains 'Under Review' %} publication-venue--review{% endif %}">[{{ paper.venue }}]</span>
    {{ paper.citation | markdownify | remove: '<p>' | remove: '</p>' }}
  </li>
  {% endfor %}
</ul>
